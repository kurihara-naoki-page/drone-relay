<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Drone Relay</title>
<style>
  html, body { margin: 0; height: 100%; background: #c9dfb8; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  Drone Delivery - prototype 2  (試作1 + 供給元3つ・荷物3色)
//  画面幅を 100 とした相対座標。16:9 固定 (100 x 56.25)。
//  文字なし (数字と絵記号だけ)。素材なし (四角・丸・線だけ)。
// =====================================================================
const W = 100, H = 56.25;

// ---- 初期値 (遊んで直す) --------------------------------------------
const CFG = {
  L: 25,                 // 航続距離: 空路1本の上限
  R: 8,                  // ハブのサービス範囲
  houseHalf: 1.6,        // 家の絵の半径。円に絵が少しでもかかれば配達可能 (判定 = R + houseHalf)
  buildT: 10,            // 建設中の時間 (秒)。置いた直後・動かした直後はこの間だけ働かない
  holdT: 0.5,            // ハブを長押しして持ち上げる (動かす) までの秒数。ドラッグは常に「空路を引く」
  tools: ['range', 'reach'],   // 週のごほうび: ハブは必ず1つ + 「ドローン」か「道具」の2択。道具はここから無作為
  toolRange: 1, toolReach: 4,  // 道具の効き目: サービス範囲 +1 / 航続距離 +4
  rangeAnimT: 1.4,       // 範囲拡大を選んだ直後、全ハブの円が旧→新の大きさへ広がる動きの秒数 (+1 は見た目の差が小さいので動きで見せる)
  milkWeek: 2,           // 牧場 (牛乳) が現れる週 (試作2)
  speed: 100 / 6,        // ドローン速度: 画面幅を約6秒で横断
  startHubStock: 1,      // 開始時の手持ちハブ (配置済み1 + 手持ち1)
  startDrones: 3,
  houseInt0: 22, houseShrink: 0.97, houseIntMin: 8,   // 家の追加間隔 (Mini Metro の駅の間隔に近づけた。週に2〜4軒)
  nearBias: 0.65, nearRmin: 0.7, nearRmax: 1.9,       // 家は「すでに覆っている範囲の近く」に生えやすい (確率・範囲 R の倍率)
  startHouses: [[60, 27, 'mail'], [29, 35, 'mail'], [18, 20, 'veg']],   // 開始時の家と最初の注文 (最初の1分を静かにしない)
  orderInt: 20, orderJitter: 0.3,                     // 家1軒の注文間隔
  N: 6, G: 10,           // 溢れの閾値 (届いていない注文の数・運んでいる最中も含む) / 猶予 (秒)
  week: 60,              // 1週間の長さ (秒)
  zoneEvery: 3, zoneRmin: 6, zoneRmax: 10,            // 禁止区域
  // 当たり判定・見た目
  hubR: 1.6, whR: 2.4, srcR: 2.0, nodeHit: 2.8, edgeHit: 1.1, snap: 3.4,
};
// 荷物の種類 (色で区別。文字なし)
const KINDS = {
  mail: { fill: '#c99a5b', line: '#7a5a30', roof: '#8a7353' },
  veg:  { fill: '#8cc07a', line: '#4d7a3e', roof: '#5f9a4e' },
  milk: { fill: '#f7f4ec', line: '#6f95b8', roof: '#7fa6c9' },
};
// 供給元 (倉庫=郵便・畑=野菜・牧場=牛乳)。位置は固定。牧場は milkWeek で現れる
const SRC_DEFS = [
  { goods: 'mail', x: 35, y: 28,   home: true, on: true },
  { goods: 'veg',  x: 19, y: 12.5, on: true },
  { goods: 'milk', x: 70, y: 48.5, on: false },
];

// ---- Canvas ---------------------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, ox = 0, oy = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: ((e.clientX - r.left) * dpr - ox) / scale, y: ((e.clientY - r.top) * dpr - oy) / scale };
}

// ---- 幾何 -----------------------------------------------------------
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function segPointDist(a, b, p) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  let t = l2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
const segCircleHit = (a, b, c, r) => segPointDist(a, b, c) < r;
const rnd = (a, b) => a + Math.random() * (b - a);

// ---- 音 (Web Audio 合成・音源ファイルなし) ----------------------------
const Snd = {
  ac: null,
  unlock() {
    if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ac = null; } }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  tone(f, d, type, g, t0) {
    if (!this.ac) return;
    const ac = this.ac, o = ac.createOscillator(), v = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    const t = ac.currentTime + (t0 || 0);
    v.gain.setValueAtTime(0.0001, t);
    v.gain.exponentialRampToValueAtTime(g || 0.15, t + 0.012);
    v.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(v).connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
  },
  chime() { this.tone(880, 0.35, 'sine', 0.10); this.tone(1320, 0.5, 'sine', 0.05, 0.06); },
  thump() { this.tone(55, 0.28, 'sine', 0.35); },
  week() { this.tone(523, 0.18, 'triangle', 0.10); this.tone(784, 0.35, 'triangle', 0.10, 0.14); },
  over() { this.tone(330, 0.4, 'triangle', 0.12); this.tone(220, 0.9, 'triangle', 0.12, 0.3); },
  place() { this.tone(660, 0.07, 'square', 0.03); },
  nope() { this.tone(180, 0.12, 'square', 0.04); },
  lift() { this.tone(330, 0.08, 'triangle', 0.06); this.tone(495, 0.12, 'triangle', 0.06, 0.06); },
  appear() { this.tone(440, 0.15, 'sine', 0.08); this.tone(660, 0.25, 'sine', 0.08, 0.12); this.tone(880, 0.4, 'sine', 0.06, 0.24); },
};

// ---- 状態 -----------------------------------------------------------
let S = null;
function newGame() {
  S = {
    t: 0, week: 1, weekT: 0, WH: null, sources: [],
    hubs: [], edges: [], zones: [], drones: [], houses: [],
    hubStock: CFG.startHubStock, delivered: 0,
    R: CFG.R, L: CFG.L, rewardTool: null,   // 範囲と航続距離は道具で伸びる (試作3)
    rangeFrom: CFG.R, rangeT: 0,            // 範囲が広がる動き (旧い半径・残り秒数)
    lastKind: null, deliverT: 0,            // 最後に届けた荷物の種類・届けた数の数字がその色でふくらむ残り秒数
    houseInt: CFG.houseInt0, nextHouse: CFG.houseInt0,
    over: false, overT: 0, reward: false, paused: false, speed: 1,
    info: false, started: false,        // 小窓 (プライバシーポリシーの入口) / 最初の入力があったか (ポータル SDK の gameplayStart 用)
    hbT: 0, nextId: 1, flash: 0,
  };
  for (const def of SRC_DEFS) {
    const s = Object.assign({ kind: 'src', reach: false, born: 0, id: S.nextId++ }, def);
    S.sources.push(s); if (s.home) S.WH = s;
  }
  // 最初の10秒で分かる状態: 倉庫・畑 (つないである)・家1軒・ハブ1つ・飛ぶドローン。
  // 畑は最初からつないでおき「野菜は畑から来る」を先に見せる。「供給元は自分でつなぐ」は週2の牧場で学ぶ
  const h = addHub(55, 22, true);      // 最初の1つは建設済み
  addEdge(S.WH, h);
  addEdge(S.WH, srcOf('veg'));
  for (const [x, y, kind] of CFG.startHouses) addOrder(addHouse(x, y), kind);
  addOrder(S.houses[0], 'veg');
  for (let i = 0; i < CFG.startDrones; i++) S.drones.push(newDrone());
  recomputeReach();
}
function newDrone() {
  return { x: S.WH.x, y: S.WH.y, ang: 0, state: 'idle', node: S.WH, path: null, pathI: 0, onEdge: null,
           order: null, src: null, hub: null, carrying: false, bob: Math.random() * 6.28 };
}
function addHub(x, y, built) {
  const h = { x, y, kind: 'hub', reach: false, build: built ? 0 : CFG.buildT, id: S.nextId++ };
  S.hubs.push(h); return h;
}
const active = n => n.kind === 'src' || n.build <= 0;   // 建設中のハブは中継も配達もしない
const hasEdge = n => S.edges.some(e => e.a === n || e.b === n);
function addHouse(x, y) {
  const h = { x, y, kind: 'house', orders: [], nextOrder: CFG.orderInt * rnd(0.3, 0.8), overT: 0, pulse: 0, id: S.nextId++ };
  S.houses.push(h); return h;
}
const activeKinds = () => S.sources.filter(s => s.on).map(s => s.goods);
function addOrder(house, kind) {
  if (!kind) { const ks = activeKinds(); kind = ks[Math.floor(Math.random() * ks.length)]; }
  house.orders.push({ house, kind, t0: S.t, picked: false });
}
const srcOf = kind => S.sources.find(s => s.goods === kind);
function addEdge(a, b) { S.edges.push({ a, b }); recomputeReach(); }
function removeEdge(e) { S.edges = S.edges.filter(x => x !== e); recomputeReach(); }
const nodes = () => [...S.sources.filter(s => s.on), ...S.hubs];
const waiting = h => h.orders.length;   // 家が待っている注文 (届くまで数える。運んでいる最中も含む)
const nodeR = n => n.kind === 'hub' ? CFG.hubR : n.home ? CFG.whR : CFG.srcR;

// ---- グラフ ---------------------------------------------------------
function neighbors(n) {
  const out = [];
  for (const e of S.edges) { if (e.a === n) out.push(e.b); else if (e.b === n) out.push(e.a); }
  return out;
}
function edgeBetween(a, b) { return S.edges.find(e => (e.a === a && e.b === b) || (e.a === b && e.b === a)) || null; }
// reach = 今つながっている (建設中のハブは通らない) / soon = 建設が終わればつながる (誘導はこちらで判断する)
function recomputeReach() {
  for (const n of [...S.hubs, ...S.sources]) { n.reach = false; n.soon = false; }
  flood('reach', active); flood('soon', () => true);
}
function flood(flag, ok) {
  S.WH[flag] = true;
  const q = [S.WH], seen = new Set([S.WH]);
  while (q.length) {
    const n = q.shift();
    for (const m of neighbors(n)) if (!seen.has(m) && ok(m)) { seen.add(m); m[flag] = true; q.push(m); }
  }
}
// ダイクストラ (ノードは多くて30程度)
function findPath(from, to) {
  if (from === to) return [from];
  const ns = nodes().filter(active); if (!ns.includes(from) || !ns.includes(to)) return null;
  const d = new Map(), prev = new Map(), done = new Set();
  for (const n of ns) d.set(n, Infinity); d.set(from, 0);
  while (true) {
    let u = null, best = Infinity;
    for (const n of ns) if (!done.has(n) && d.get(n) < best) { best = d.get(n); u = n; }
    if (!u) return null;
    if (u === to) break;
    done.add(u);
    for (const v of neighbors(u)) {
      if (!active(v)) continue;
      const nd = d.get(u) + dist(u, v);
      if (nd < d.get(v)) { d.set(v, nd); prev.set(v, u); }
    }
  }
  const path = [to]; let c = to;
  while (c !== from) { c = prev.get(c); path.push(c); }
  return path.reverse();
}
// 家を受け持つノード: 倉庫からたどり着けて、サービス範囲内で最も近いもの
function servingHub(house) {
  let best = null, bd = Infinity;
  for (const n of nodes()) {
    if (!n.reach) continue;
    const dd = dist(n, house);
    if (dd <= S.R + CFG.houseHalf && dd < bd) { bd = dd; best = n; }
  }
  return best;
}
// ノードにいるドローンの次の仕事: 待ち時間の長い注文から。供給元と受け持ちハブの両方が網につながっているもの
function pickJob(node) {
  let best = null;
  for (const h of S.houses) {
    for (const o of h.orders) {
      if (o.picked || (best && o.t0 >= best.o.t0)) continue;
      const src = srcOf(o.kind); if (!src || !src.on || !src.reach) continue;
      const hub = servingHub(h); if (!hub) continue;
      best = { o, src, hub };
    }
  }
  return best;
}

// ---- 制約 (このゲームの線路) ----------------------------------------
function edgeProblem(a, b, pa, pb) {   // null なら引ける
  pa = pa || a; pb = pb || b;
  if (a === b) return 'same';
  if (edgeBetween(a, b)) return 'dup';
  if (dist(pa, pb) > S.L) return 'far';
  if (S.zones.some(z => segCircleHit(pa, pb, z, z.r))) return 'zone';
  return null;
}
function hubPosValid(p, self) {
  if (p.x < 2 || p.x > W - 2 || p.y < 6.5 || p.y > H - 2) return false;
  if (S.zones.some(z => dist(p, z) < z.r + CFG.hubR)) return false;
  for (const s of S.sources) if (dist(p, s) < nodeR(s) + CFG.hubR + 1) return false;   // まだ現れていない供給元の場所も空けておく
  for (const h of S.hubs) if (h !== self && dist(p, h) < CFG.hubR * 2 + 0.5) return false;
  for (const h of S.houses) if (dist(p, h) < 2.6) return false;
  return true;
}
function hubMoveValid(hub, p) {
  if (!hubPosValid(p, hub)) return false;
  for (const e of S.edges) {
    if (e.a === hub) { if (dist(p, e.b) > S.L || S.zones.some(z => segCircleHit(p, e.b, z, z.r))) return false; }
    else if (e.b === hub) { if (dist(e.a, p) > S.L || S.zones.some(z => segCircleHit(e.a, p, z, z.r))) return false; }
  }
  return true;
}
// 孤島のノード (または置こうとしている位置) に空路を引ける元。なければ null。建設中でも網につながる予定のハブは元になる
function hintSource(p, self) {
  let best = null, bd = Infinity;
  for (const n of nodes()) {
    if (!n.soon || n === self) continue;
    const dd = dist(n, p);
    if (dd > S.L || dd >= bd) continue;
    if (S.zones.some(z => segCircleHit(n, p, z, z.r))) continue;
    bd = dd; best = n;
  }
  return best;
}
function nearestReach(p, self) {
  let best = null, bd = Infinity;
  for (const n of nodes()) { if (!n.soon || n === self) continue; const dd = dist(n, p); if (dd < bd) { bd = dd; best = n; } }
  return best;
}
// ハブを手持ちに戻す (捨てない)。つながる空路は消え、使っていたドローンはその場で道を引き直す
function pickUpHub(h) {
  S.edges = S.edges.filter(e => e.a !== h && e.b !== h);
  S.hubs = S.hubs.filter(x => x !== h);
  h.reach = false; S.hubStock++; recomputeReach();
  rerouteDronesUsing(h);
  Snd.tone(520, 0.12, 'triangle', 0.06); Snd.tone(390, 0.16, 'triangle', 0.06, 0.08);
}
// ハブを動かす = 建て直し。建設中に戻り、そのハブを使っていたドローンは道を引き直す
function moveHub(h, p) {
  h.x = p.x; h.y = p.y; h.build = CFG.buildT; h.reach = false;
  recomputeReach(); rerouteDronesUsing(h);
}
function rerouteDronesUsing(h) {
  for (const d of S.drones) {
    const uses = d.hub === h || d.node === h || (d.path && d.path.slice(d.pathI).includes(h));
    if (!uses) continue;
    if (d.node === h) d.node = null;                    // 消えた点の上にいる → 倉庫へ直帰になる
    if (d.onEdge && (d.onEdge.a === h || d.onEdge.b === h)) d.onEdge = null;   // 空中 → 最後にいた節から引き直す
    switch (d.state) {
      case 'idle': if (!d.node) d.state = 'direct'; break;
      case 'toSrc': {
        const p = d.node ? findPath(d.node, d.src) : null;
        if (p) { d.path = p; d.pathI = 1; } else requeue(d);
        break;
      }
      case 'toHub': retarget(d); break;
      case 'toHouse': d.hub = servingHub(d.order.house); break;
      case 'backHub': d.hub = null; d.node = null; d.state = 'direct'; break;
    }
  }
}
function spotFree(p, minD) {
  for (const s of S.sources) if (dist(p, s) < minD + 3) return false;
  if (S.hubs.some(h => dist(p, h) < minD)) return false;
  if (S.houses.some(h => dist(p, h) < minD)) return false;
  if (S.zones.some(z => dist(p, z) < z.r + 1.5)) return false;
  if (S.edges.some(e => segPointDist(e.a, e.b, p) < 2.2)) return false;   // 空路の上に家を建てない
  return true;
}

// ---- 成長 -----------------------------------------------------------
function spawnHouse() {
  const n = S.houses.length;
  // 多くは、網につながっているノードの近く (範囲の内側〜少し外) に生える。毎回まったく新しい場所を覆わずに済む
  if (Math.random() < CFG.nearBias) {
    const anchors = nodes().filter(x => x.reach);
    for (let i = 0; i < 60 && anchors.length; i++) {
      const a0 = anchors[Math.floor(Math.random() * anchors.length)];
      const r = S.R * rnd(CFG.nearRmin, CFG.nearRmax), a = Math.random() * Math.PI * 2;
      const p = { x: a0.x + Math.cos(a) * r, y: a0.y + Math.sin(a) * r };
      if (p.x < 3 || p.x > W - 3 || p.y < 7.5 || p.y > H - 3) continue;
      if (!spotFree(p, 3.2)) continue;
      addHouse(p.x, p.y); return;
    }
  }
  for (let i = 0; i < 80; i++) {
    const base = Math.min(9 + n * 2.0, 44);
    const r = base + rnd(-3, 3), a = Math.random() * Math.PI * 2;
    const p = { x: S.WH.x + Math.cos(a) * r * 1.2, y: S.WH.y + Math.sin(a) * r * 0.78 };
    if (p.x < 3 || p.x > W - 3 || p.y < 7.5 || p.y > H - 3) continue;
    if (!spotFree(p, 3.2)) continue;
    addHouse(p.x, p.y); return;
  }
  for (let i = 0; i < 300; i++) {
    const p = { x: rnd(3, W - 3), y: rnd(7.5, H - 3) };
    if (spotFree(p, 3.0)) { addHouse(p.x, p.y); return; }
  }
}
function spawnZone() {
  let best = null;
  for (let i = 0; i < 120; i++) {
    const r = rnd(CFG.zoneRmin, CFG.zoneRmax);
    const c = { x: rnd(r + 2, W - r - 2), y: rnd(r + 6, H - r - 2), r };
    if (S.sources.some(s => dist(c, s) < r + 5)) continue;
    if (S.hubs.some(h => dist(h, c) < r + CFG.hubR + 1)) continue;
    if (S.houses.some(h => dist(h, c) < r + 1.5)) continue;
    const cuts = S.edges.filter(e => segCircleHit(e.a, e.b, c, r)).length;
    // 空路を切る位置も「空いている場所」の候補。切らない位置を優先し、なければ切る
    if (!best || cuts < best.cuts) { best = { c, cuts }; if (cuts === 0 && i > 20) break; }
  }
  if (!best) return;
  const z = best.c;
  z.kind = ['fes', 'bird', 'school'][Math.floor(Math.random() * 3)];
  z.born = S.t;
  S.zones.push(z);
  S.edges = S.edges.filter(e => !segCircleHit(e.a, e.b, z, z.r));
  recomputeReach();
}
function activateSource(goods) {      // 新しい供給元が現れる (家がその荷物を頼み始める)
  const s = srcOf(goods); if (!s || s.on) return;
  s.on = true; s.born = S.t; recomputeReach(); Snd.appear();
}

// ---- ドローン -------------------------------------------------------
function moveTo(d, tx, ty, dt) {
  const dx = tx - d.x, dy = ty - d.y, L = Math.hypot(dx, dy), step = CFG.speed * dt;
  if (L > 0.001) d.ang = Math.atan2(dy, dx);
  if (L <= step) { d.x = tx; d.y = ty; return true; }
  d.x += dx / L * step; d.y += dy / L * step; return false;
}
// 空路の網の上を d.path に沿って進む。節に着くたびに道を確かめ直す (空路が切れた・ハブが動いた)
// 戻り値: true = 終点に着いた / 'lost' = 道がない / false = 進行中
function travel(d, dt) {
  const dest = d.path[d.path.length - 1];
  const tgt = d.path[d.pathI];
  if (!tgt) return true;
  if (!d.onEdge) {

// ---- 進行 -----------------------------------------------------------
// 最高記録 (端末に保存・外部通信なし)。届けた数で比べる。読めない環境 (保存を止めたブラウザ等) では黙って無効
const BEST_KEY = 'droneRelay.best';
function loadBest() {
  try { const v = JSON.parse(localStorage.getItem(BEST_KEY)); return v && typeof v.delivered === 'number' ? v : null; }
  catch (e) { return null; }
}
function saveBest(v) { try { localStorage.setItem(BEST_KEY, JSON.stringify(v)); } catch (e) {} }
function gameOver() {
  S.over = true; S.overT = 0;

  S.record = !prev || S.delivered > prev.delivered;   // 今回が最高 (同点は更新しない)
  S.best = S.record ? S.delivered : prev.delivered;
  if (S.record) saveBest({ delivered: S.delivered, week: S.week, at: Date.now() });
  Snd.over();
}
function update(dt) {
  S.flash = Math.max(0, S.flash - dt);
  S.rangeT = Math.max(0, S.rangeT - dt);
  S.deliverT = Math.max(0, S.deliverT - dt);
  for (const h of S.houses) h.pulse = Math.max(0, h.pulse - dt * 3);
  if (S.over) { S.overT += dt; return; }
  if (S.reward || S.paused || S.info) return;
  S.t += dt; S.weekT += dt;
  // 建設中のハブ
  let built = false;
  for (const h of S.hubs) if (h.build > 0) { h.build -= dt; if (h.build <= 0) { h.build = 0; built = true; } }
  if (built) { recomputeReach(); Snd.tone(660, 0.1, 'triangle', 0.07); Snd.tone(990, 0.2, 'triangle', 0.07, 0.09); }
  // 家が増える
  S.nextHouse -= dt;
  if (S.nextHouse <= 0) {
    spawnHouse();
    S.houseInt = Math.max(CFG.houseIntMin, S.houseInt * CFG.houseShrink);
    S.nextHouse = S.houseInt;
  }
  // 注文と溢れ

    h.nextOrder -= dt;
    if (h.nextOrder <= 0) { addOrder(h); h.nextOrder = CFG.orderInt * (1 + rnd(-1, 1) * CFG.orderJitter); }
    if (waiting(h) >= CFG.N) { h.overT += dt; if (h.overT >= CFG.G) { gameOver(); return; } }
    else h.overT = 0;
  }
  for (const d of S.drones) droneUpdate(d, dt);
  // 鼓動
  if (S.houses.some(h => h.overT > 0)) { S.hbT -= dt; if (S.hbT <= 0) { Snd.thump(); S.hbT = 0.8; } }
  else S.hbT = 0;
  // 週のごほうび
  if (S.weekT >= CFG.week) {
    S.weekT -= CFG.week; S.week++; Snd.week(); S.reward = true;
    S.rewardTool = CFG.tools[Math.floor(Math.random() * CFG.tools.length)];
  }
}
// ごほうび: ハブは必ず1つ。そのうえで「ドローン」か「道具」(範囲拡大／航続延長) を選ぶ (Mini Metro の「機関車は必ず + 2択」と同じ形)
function chooseReward(which) {
  S.hubStock++;
  if (which === 'drone') S.drones.push(newDrone());
  else if (S.rewardTool === 'range') { S.rangeFrom = S.R; S.R += CFG.toolRange; S.rangeT = CFG.rangeAnimT; recomputeReach(); }
  else if (S.rewardTool === 'reach') S.L += CFG.toolReach;
  S.reward = false;
  if (S.week === CFG.milkWeek) activateSource('milk');
  if (S.week > 1 && (S.week - 1) % CFG.zoneEvery === 0) spawnZone();
}

}
const holdFrac = () => (ptr && !ptr.drag && ptr.hit && ptr.hit.kind === 'hub') ? Math.min(1, (performance.now() - ptr.downT) / (CFG.holdT * 1000)) : 0;

      if (dist(from, p) < 0.9) return;                // 持ち上げただけで動かさない = そのまま置く (建て直しにしない)

  if (e.key === 'f' || e.key === 'F') S.speed = S.speed === 1 ? 2 : 1;

    ctx.fillStyle = C.roof; ctx.beginPath(); ctx.moveTo(hx - 0.85, hy - 0.45); ctx.lineTo(hx, hy - 1.1); ctx.lineTo(hx + 0.85, hy - 0.45); ctx.closePath(); ctx.fill();
    if (g > 0.95) { ctx.strokeStyle = 'rgba(79,120,179,0.85)'; ctx.lineWidth = 0.2; circle(hx, hy, 1.4); ctx.stroke(); }
  } else {
    const ph = (now % 2.4) / 2.4;                       // 0〜0.3 届かない赤 → 0.3〜0.7 伸びる → 残り 青くつながったまま
    const A = { x: -5.2, y: 1.4 }, B = { x: 5.2, y: -1.6 };
    const full = Math.hypot(B.x - A.x, B.y - A.y), short = full * 0.62;
    const g = ease((ph - 0.3) / 0.4), len = short + (full - short) * g, done = g >= 0.999;
    const a = Math.atan2(B.y - A.y, B.x - A.x), ex = A.x + Math.cos(a) * len, ey = A.y + Math.sin(a) * len;
    ctx.strokeStyle = done ? C.road : (g > 0 ? C.ok : C.bad); ctx.lineWidth = 0.45;
    if (!done) ctx.setLineDash([1.0, 0.7]);
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(ex, ey); ctx.stroke(); ctx.setLineDash([]);
    if (!done) { ctx.fillStyle = g > 0 ? C.ok : C.bad; circle(ex, ey, 0.5); ctx.fill(); }
    drawHubIcon(A.x, A.y, 1.1);
    ctx.globalAlpha = done ? 1 : 0.45; drawHubIcon(B.x, B.y, 1.1); ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawReward(now) {
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(0, 0, W, H);
  // 週の区切りの印
  ctx.strokeStyle = C.ink; ctx.lineWidth = 0.5; circle(50, 10, 2.4); ctx.stroke();
  text(String(S.week), 50, 10.1, 3.2, C.ink, 'center', true);
  // ハブは必ず1つ (選ばなくてももらえる。上に置いて見せる)
  ctx.globalAlpha = 0.5; drawRange({ x: 47.5, y: 17.5 }, 0.9); ctx.globalAlpha = 1;
  drawHubIcon(47.5, 17.5, 1.8);
  text('+1', 51.2, 17.6, 3.2, C.ink, 'left', true);
  // 2択: ドローン / 道具
  for (const k in CARD) {
    const c = CARD[k];
    ctx.fillStyle = '#ffffff'; rr(c.x - c.w / 2, c.y - c.h / 2, c.w, c.h, 1.5); ctx.fill();
    ctx.strokeStyle = C.hubLine; ctx.lineWidth = 0.35; ctx.stroke();
    if (k === 'drone') { drawDroneIcon(c.x, c.y - 1.5, 2.6); text('+1', c.x, c.y + 5.2, 3.6, C.ink, 'center', true); }
    else drawToolIcon(S.rewardTool, c.x, c.y - 0.5, now);
  }
}
// 小窓 = 「このゲームについて」。i の記号は「案内」を約束するので、中身が Privacy Policy だけでは看板違い (2026-09-10 外部レビューの指摘で改修)
// 上に絵だけの遊び方3コマ (動く・文字なし)、下に Privacy Policy の1行 (文字なし方針の唯一の例外。ポータルが求める入口。2026-09-09 本人裁定)
const INFO_BOX = { x: 13, y: 9.5, w: 74, h: 37.5 };
const INFO_PANEL = { xs: [26, 50, 74], y: 26.5, w: 22, h: 21 };   // 3コマの中心と大きさ
const clamp01 = k => Math.max(0, Math.min(1, k));
const easeOut = k => 1 - Math.pow(1 - clamp01(k), 3);
function drawTouch(x, y, a) {          // 指 (押している場所) の印
  if (a <= 0) return;
  ctx.fillStyle = 'rgba(59,63,71,' + (0.22 * a) + ')'; circle(x, y, 1.15); ctx.fill();
  ctx.strokeStyle = 'rgba(59,63,71,' + (0.75 * a) + ')'; ctx.lineWidth = 0.22; circle(x, y, 1.15); ctx.stroke();
}
function drawMiniHouse(x, y, served) { // 小窓用の家 (本編の drawHouse と同じ見た目。届かない家は色を抜いて点線の枠)
  ctx.save(); ctx.translate(x, y);
  if (served) {
    ctx.fillStyle = C.house; rr(-1.2, -0.9, 2.4, 2.1, 0.5); ctx.fill();
    ctx.strokeStyle = C.houseLine; ctx.lineWidth = 0.25; ctx.stroke(); ctx.fillStyle = C.roof;
  } else {
    ctx.fillStyle = '#ece6da'; rr(-1.2, -0.9, 2.4, 2.1, 0.5); ctx.fill();
    ctx.strokeStyle = '#a89d8c'; ctx.lineWidth = 0.22; ctx.setLineDash([0.5, 0.4]); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#d3cbbd';
  }
  ctx.beginPath(); ctx.moveTo(-1.45, -0.8); ctx.lineTo(0, -1.9); ctx.lineTo(1.45, -0.8); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawMiniRange(x, y, r, alpha) {
  ctx.fillStyle = C.range + (0.10 * alpha) + ')'; circle(x, y, r); ctx.fill();
  ctx.strokeStyle = C.range + (0.45 * alpha) + ')'; ctx.lineWidth = 0.2; ctx.stroke();
}
// コマ1: 供給元からハブへ指を引くと空路がつながり、ドローンが荷物を家へ届ける (線を引く操作 = 遊びの中心)
function drawInfoPanel0(now) {
  const t = now % 4.4;
  const src = { goods: 'mail', x: -6.5, y: 4.5, reach: true, on: true, kind: 'src' };
  const B = { x: 5.5, y: -3.5, build: 0 }, house = { x: 7.2, y: 5.2 };
  const drag = easeOut((t - 0.5) / 1.0), linked = t >= 1.5;
  drawMiniRange(B.x, B.y, 5.4, linked ? 1 : 0.35);
  if (t >= 0.5) {                      // 引いている最中は青い点線・指先に点。離すと空路 (実線)
    const tip = { x: src.x + (B.x - src.x) * drag, y: src.y + (B.y - src.y) * drag };
    if (linked) { ctx.strokeStyle = C.road; ctx.lineWidth = 0.45; ctx.beginPath(); ctx.moveTo(src.x, src.y); ctx.lineTo(B.x, B.y); ctx.stroke(); }
    else { dashed(src, tip, C.ok, 0.35, now * 6); ctx.fillStyle = C.ok; circle(tip.x, tip.y, 0.45); ctx.fill(); }
  }
  drawMiniHouse(house.x, house.y, linked);
  if (t < 3.35) drawPackage(house.x + 2.0, house.y + 0.6, 0.95, 'mail');   // 家が待っている荷物。届いた瞬間に消える
  drawSource(src);
  drawHub(B, linked ? 1 : 0.4, false);
  const d = { bob: 0, carrying: true, order: { kind: 'mail' } };
  if (t < 1.7) drawDrone(d, now, src.x, src.y - 4.3, true);
  else if (t < 2.6) { const k = easeOut((t - 1.7) / 0.9); drawDrone(d, now, src.x + (B.x - src.x) * k, src.y - 4.3 + (B.y - src.y + 4.3) * k, false); }
  else if (t < 3.35) { const k = easeOut((t - 2.6) / 0.75); drawDrone(d, now, B.x + (house.x - 1.6 - B.x) * k, B.y + (house.y - 1.6 - B.y) * k, false); }
  else { d.carrying = false; drawDrone(d, now, house.x - 1.6, house.y - 1.6, true); }
  const ta = t < 0.5 ? clamp01((t - 0.2) / 0.3) : t < 1.5 ? 1 : clamp01(1 - (t - 1.5) / 0.3);
  drawTouch(src.x + (B.x - src.x) * drag, src.y + (B.y - src.y) * drag, ta);
}
// コマ2: 届かない家に荷物が積み上がると赤い輪が縮み、終了 (何をすると失敗するか)
function drawInfoPanel1(now) {
  const t = now % 4.6, house = { x: -1.5, y: 0.5 };
  drawMiniHouse(house.x, house.y, false);
  const n = Math.min(6, Math.floor(t / 0.36));
  const kinds = ['mail', 'veg', 'mail', 'milk', 'mail', 'veg'];
  for (let i = 0; i < n; i++) drawPackage(house.x + 2.0 + (i % 3) * 1.15, house.y + 0.6 - Math.floor(i / 3) * 1.15, 0.95, kinds[i]);
  if (t >= 2.3) {                      // 縮む輪 (本編と同じ)
    const r = 6.5 - (6.5 - 2.2) * clamp01((t - 2.3) / 1.2);
    ctx.strokeStyle = 'rgba(224,83,79,0.9)'; ctx.lineWidth = 0.35; circle(house.x, house.y, r); ctx.stroke();
  }
  if (t >= 3.5) {                      // 終了: 暗くなって赤い×
    ctx.fillStyle = 'rgba(52,58,72,0.5)'; ctx.fillRect(-INFO_PANEL.w, -INFO_PANEL.h, INFO_PANEL.w * 2, INFO_PANEL.h * 2);
    ctx.strokeStyle = C.bad; ctx.lineWidth = 0.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(house.x - 2.2, house.y - 2.2); ctx.lineTo(house.x + 2.2, house.y + 2.2);
    ctx.moveTo(house.x + 2.2, house.y - 2.2); ctx.lineTo(house.x - 2.2, house.y + 2.2); ctx.stroke();
  }
}
// コマ3: ハブを長押しすると輪が満ちて持ち上がり、指について動く。離すと建設中 (動かす操作)
function drawInfoPanel2(now) {
  const t = now % 4.4;
  const A = { x: -4.5, y: 0.5 }, Bx = 4.5, By = 0.5;
  const hold = clamp01((t - 0.4) / 0.6), lifted = t >= 1.0, mv = easeOut((t - 1.0) / 1.2), dropped = t >= 2.2;
  const gx = A.x + (Bx - A.x) * mv, gy = A.y + (By - A.y) * mv;
  if (dropped) {
    const b = { x: Bx, y: By, build: CFG.buildT * (1 - clamp01((t - 2.2) / 2.0)) };
    drawMiniRange(Bx, By, 5.4, 0.35 + 0.65 * clamp01((t - 2.2) / 2.0));
    drawHub(b, 1, false);
  } else {
    drawMiniRange(A.x, A.y, 5.4, 1);
    drawHub(A, lifted ? 0.4 : 1, false);
    if (hold > 0.15 && !lifted) {      // 長押しの進み具合の輪 (本編と同じ)
      ctx.strokeStyle = 'rgba(79,120,179,0.9)'; ctx.lineWidth = 0.35;
      ctx.beginPath(); ctx.arc(A.x, A.y, CFG.hubR + 0.9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * hold); ctx.stroke();
    }
    if (lifted) {                      // 持ち上がったハブ (影つき) が指についてくる
      ctx.fillStyle = 'rgba(40,50,40,0.18)'; ctx.beginPath(); ctx.ellipse(gx + 0.9, gy - 0.6, CFG.hubR * 1.1, CFG.hubR * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      drawHub({ x: gx, y: gy - 2.4, build: 0 }, 0.85, false);   // 指の少し上に持ち上がる (指の印と重ねない)
    }
  }
  const ta = t < 0.4 ? clamp01((t - 0.1) / 0.3) : t < 2.2 ? 1 : clamp01(1 - (t - 2.2) / 0.3);
  drawTouch(gx, gy, ta);
}
function drawInfo(now) {
  ctx.fillStyle = 'rgba(52,58,72,0.45)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff'; rr(INFO_BOX.x, INFO_BOX.y, INFO_BOX.w, INFO_BOX.h, 1.6); ctx.fill();
  ctx.fillStyle = C.hubLine; circle(50, 12.6, 1.5); ctx.fill();               // i の印
  ctx.fillStyle = '#ffffff'; circle(50, 11.9, 0.27); ctx.fill(); ctx.fillRect(50 - 0.22, 12.35, 0.44, 1.05);
  const P = INFO_PANEL;
  [drawInfoPanel0, drawInfoPanel1, drawInfoPanel2].forEach((fn, i) => {
    const px = P.xs[i];
    ctx.fillStyle = C.grass; rr(px - P.w / 2, P.y - P.h / 2, P.w, P.h, 1.2); ctx.fill();
    ctx.strokeStyle = 'rgba(79,120,179,0.35)'; ctx.lineWidth = 0.2; ctx.stroke();
    ctx.save(); ctx.beginPath(); rr(px - P.w / 2, P.y - P.h / 2, P.w, P.h, 1.2); ctx.clip();
    ctx.translate(px, P.y); ctx.lineCap = 'round'; fn(now); ctx.restore();
  });
  const w = textW('Privacy Policy', 2.8, true);
  text('Privacy Policy', INFO_LINK.x, INFO_LINK.y, 2.8, C.hubLine, 'center', true);
  ctx.strokeStyle = C.hubLine; ctx.lineWidth = 0.18;
  ctx.beginPath(); ctx.moveTo(INFO_LINK.x - w / 2, INFO_LINK.y + 1.7); ctx.lineTo(INFO_LINK.x + w / 2, INFO_LINK.y + 1.7); ctx.stroke();
}
function drawOver() {
  const a = Math.min(1, S.overT / 0.6);
  ctx.fillStyle = 'rgba(52,58,72,' + (0.55 * a) + ')'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  drawPackage(50 - 4.5, 22, 4.2, 'mail');
  text(String(S.delivered), 50 - 1.2, 22.2, 8, '#ffffff', 'left', true);
  // 最高記録: 星と数字。今回が最高なら金色でふくらむ (数字は同じ値)。過去の記録が上なら白く小さく
  if (S.best != null) {
    const rec = S.record, k = rec ? 1 + 0.18 * Math.max(0, Math.sin(S.overT * 5)) : 1;
    ctx.fillStyle = rec ? '#f2c14e' : 'rgba(255,255,255,0.75)';
    star(50 - 2.6, 30.2, 1.35 * k); ctx.fill();
    text(String(S.best), 50 - 0.6, 30.3, 3.6 * k, rec ? '#f2c14e' : 'rgba(255,255,255,0.75)', 'left', true);
  }
  // やり直しの印 (円弧と矢じり)
  const cx = 50, cy = 38.5;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, 3, -Math.PI * 0.35, Math.PI * 1.35); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(cx + 1.3, cy - 3.6); ctx.lineTo(cx + 3.4, cy - 1.3); ctx.lineTo(cx + 0.6, cy - 1.1); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function draw(now) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#b9d2a6'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  drawTerrain();
  drawZones();
  // サービス範囲 (供給元も受け持つ)
  for (const s of S.sources) if (s.on) drawRange(s, s.reach ? 1 : 0.35);
  for (const h of S.hubs) drawRange(h, h.reach ? 1 : (h.build > 0 ? 0.35 + 0.5 * (1 - h.build / CFG.buildT) : 0.35));
  drawEdges();
  drawHints(now);
  computePreview();
  for (const h of S.houses) drawHouse(h, !!servingHub(h));
  for (const s of S.sources) if (s.on) drawSource(s);
  for (const h of S.hubs) drawHub(h, h.reach ? 1 : 0.4, false);
  const hf = holdFrac();               // 長押しの進み具合: 輪が満ちると持ち上がる
  if (hf > 0.15) {
    const h = ptr.hit;
    ctx.strokeStyle = 'rgba(79,120,179,0.9)'; ctx.lineWidth = 0.35;
    ctx.beginPath(); ctx.arc(h.x, h.y, CFG.hubR + 0.9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * hf); ctx.stroke();
  }
  drawDrones(now);
  drawHUD();
  if (S.reward) drawReward(now);
  if (S.info) drawInfo(now);
  if (S.over) drawOver();
  ctx.restore();
}

// ---- ポータル SDK の差し込み口 -------------------------------------------
// Poki (gameLoadingFinished / gameplayStart / gameplayStop) と CrazyGames (loadingStop / gameplayStart / gameplayStop) は
// 求める合図が同じ。どちらに出すか決まるまで中身は空。毎フレーム「遊んでいる状態か」を見て、変わったときだけ1回呼ぶ (二重発火なし)
const Portal = {
  playing: false,
  loadingFinished() {},               // 最初の描画が終わったとき (1回)
  gameplayStart() {}, gameplayStop() {},
  sync(active) { if (active === this.playing) return; this.playing = active; if (active) this.gameplayStart(); else this.gameplayStop(); },
};
const isPlaying = () => S.started && !S.over && !S.reward && !S.paused && !S.info && !document.hidden;

// ---- ループ ---------------------------------------------------------
newGame();
let last = performance.now();
function frame(now) {
  if (cv.width !== Math.round(innerWidth * (window.devicePixelRatio || 1)) ||
      cv.height !== Math.round(innerHeight * (window.devicePixelRatio || 1))) resize();   // resize イベントを取りこぼしても追従
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (document.hidden) dt = 0;
  checkHold();
  update(dt * S.speed);
  draw(now / 1000);
  if (!frame.loaded) { frame.loaded = true; Portal.loadingFinished(); }
  Portal.sync(isPlaying());
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
