  // (ハブも家も置けない)。滑走路は町の真ん中を東西に横切り、空港の向こう (北) へは東か西を回って網を届ける。川はない。数字は他の町と同じ。

  // 空域は陸を減らしすぎない大きさ (家を建てられる陸 86%・その 95% を覆うのに要るハブ 17〜18 = 今の町 18〜19・川向こうの町 15。measure_land.py)

    startHouses: [[66, 39, 'mail'], [36, 38, 'mail'], [18, 40, 'veg'], [76, 44, 'mail']],   // 最後の 1 軒 = 最初から届かない家
    sea: null, rocks: [], letterbox: '#a9c98f',
    zones: [[36, 28, 66, 28, 6]],      // 空域 = 滑走路の中心線 (36,28)→(66,28) から半径 6
    fields: [[19, 43, 10, 7], [4, 12, 12, 8], [80, 44, 13, 8]], pastures: [[43, 8, 14, 8], [84, 10, 11, 8], [6, 28, 9, 7]],

};
// 町を開く順と目標 (2026-09-24 本人裁定・DECISIONS #041)。難しさの順ではなく、新しい考え方が 1 つずつ増える順
// (細い川に置けない → 大きな川に置けないが越えて飛べる・決まった所で渡る → 空域は飛べない・回り込む)。
// need = ひとつ前の町の 1 局で届ければ開く荷物の数。今の町は 80 → 120 (2026-09-24 本人の試遊「80 は簡単すぎる」・調整 1 回目。
// ボット 60 局で網を広げる局の 60〜80%・週 5〜6)。川向こうの町の 100 は据え置き (ボットに一番厳しい町)
const ORDER = [
  { id: 'base', need: 0 },
  { id: 'island', need: 120 },
  { id: 'airport', need: 100 },
];
// 遊んでいる町。一覧から選ぶと setTown で差し替える (町の地形・供給元の位置・最高記録の保存先がまとめて変わる)
let TOWN_ID = null, TOWN = null, SEA = [], BEST_KEY = '';
const URL_TOWN = (() => { try { const t = new URLSearchParams(location.search).get('town'); return TOWNS[t] ? t : null; } catch (e) { return null; } })();
// 供給元 (倉庫=郵便・畑=野菜・牧場=牛乳)。位置は町ごとに固定。牧場は milkWeek で現れる
const srcDefs = () => [

  { goods: 'veg',  x: TOWN.src.veg[0],  y: TOWN.src.veg[1],  on: true },

// ---- Canvas ---------------------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, ox = 0, oy = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: ((e.clientX - r.left) * dpr - ox) / scale, y: ((e.clientY - r.top) * dpr - oy) / scale };
}

// ---- 幾何 -----------------------------------------------------------
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function segPointDist(a, b, p) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  let t = l2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
const segCircleHit = (a, b, c, r) => segPointDist(a, b, c) < r;
function segSegDist(p1, p2, q1, q2) {  // 線分どうしの最短距離 (交われば 0)
  const cr = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  const d1 = cr(q1, q2, p1), d2 = cr(q1, q2, p2), d3 = cr(p1, p2, q1), d4 = cr(p1, p2, q2);
  if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return 0;
  return Math.min(segPointDist(q1, q2, p1), segPointDist(q1, q2, p2), segPointDist(p1, p2, q1), segPointDist(p1, p2, q2));
}
// 空域 (禁止区域) = 線分 a→b から半径 r の、端の丸い帯 (a = b なら円)。飛行場の町は滑走路に沿った細長い空域
// 空域の中にはハブも家も置けず、空路も家へ届ける一跳びも通れない
const zoneDist = (z, p) => segPointDist(z.a, z.b, p);
const inZone = (p, m) => S.zones.some(z => zoneDist(z, p) < z.r + (m || 0));
const crossesZone = (p, q) => S.zones.some(z => segSegDist(p, q, z.a, z.b) < z.r);
const rnd = (a, b) => a + Math.random() * (b - a);
// 水 (ハブも家も置けない所) = 川向こうの町の大きな川 (sea) と、今の町の細い川 (river をベジェから短い帯に分けたもの)。水のない所はどこでも陸
function bezierPt(c, t) {
  const u = 1 - t;
  return { x: u * u * u * c[0][0] + 3 * u * u * t * c[1][0] + 3 * u * t * t * c[2][0] + t * t * t * c[3][0],
           y: u * u * u * c[0][1] + 3 * u * u * t * c[1][1] + 3 * u * t * t * c[2][1] + t * t * t * c[3][1] };
}
function riverBands(rv) {
  if (!rv) return [];
  const out = [];
  for (const c of rv.curves) for (let i = 0; i < 30; i++) out.push({ a: bezierPt(c, i / 30), b: bezierPt(c, (i + 1) / 30), r: rv.r });
  return out;
}
const seaOf = t => [...(t.sea || []).map(s => ({ a: { x: s[0], y: s[1] }, b: { x: s[2], y: s[3] }, r: s[4] })), ...riverBands(t.river)];
function setTown(id) {                 // 町を差し替える。このあと newGame() で局を始める
  TOWN_ID = id; TOWN = TOWNS[id]; SEA = seaOf(TOWN);
  BEST_KEY = 'droneRelay.exp.town.' + id + '.best';   // 実験版は町ごと・公開版 (droneRelay.best) と分ける
}
setTown(URL_TOWN || ORDER[0].id);
const inSea = (p, m) => SEA.some(s => segPointDist(s.a, s.b, p) < s.r + (m || 0));
const onLand = (p, m) => !inSea(p, m);   // m = 岸から陸の内側へ取る余白
const onRock = p => TOWN.rocks.some(r => Math.hypot(p.x - r[0], p.y - r[1]) <= 0.5);
function snapSpot(p) {                 // 岩の近くを押したら岩の真ん中へ (指でも置ける)
  const r = TOWN.rocks.find(r => Math.hypot(p.x - r[0], p.y - r[1]) <= r[2] + 1.4);
  return r ? { x: r[0], y: r[1] } : p;
}

// ---- 音 (Web Audio 合成・音源ファイルなし) ----------------------------
const Snd = {
  ac: null,
  unlock() {
    if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ac = null; } }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  tone(f, d, type, g, t0) {
    if (!this.ac) return;
    const ac = this.ac, o = ac.createOscillator(), v = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    const t = ac.currentTime + (t0 || 0);
    v.gain.setValueAtTime(0.0001, t);
    v.gain.exponentialRampToValueAtTime(g || 0.15, t + 0.012);
    v.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(v).connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
  },
  chime() { this.tone(880, 0.35, 'sine', 0.10); this.tone(1320, 0.5, 'sine', 0.05, 0.06); },
  thump() { this.tone(55, 0.28, 'sine', 0.35); },
  week() { this.tone(523, 0.18, 'triangle', 0.10); this.tone(784, 0.35, 'triangle', 0.10, 0.14); },
  over() { this.tone(330, 0.4, 'triangle', 0.12); this.tone(220, 0.9, 'triangle', 0.12, 0.3); },
  place() { this.tone(660, 0.07, 'square', 0.03); },
  nope() { this.tone(180, 0.12, 'square', 0.04); },
  lift() { this.tone(330, 0.08, 'triangle', 0.06); this.tone(495, 0.12, 'triangle', 0.06, 0.06); },
  appear() { this.tone(440, 0.15, 'sine', 0.08); this.tone(660, 0.25, 'sine', 0.08, 0.12); this.tone(880, 0.4, 'sine', 0.06, 0.24); },
  unlock() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.3 + i * 0.1, 'triangle', 0.09, i * 0.09)); },   // 次の町の鍵が開く
};

// ---- 状態 -----------------------------------------------------------
let S = null;
function newGame() {
  S = {
    t: 0, week: 1, weekT: 0, WH: null, sources: [],
    hubs: [], edges: [], zones: [], drones: [], houses: [],
    hubStock: TOWN.startHubStock ?? CFG.startHubStock, delivered: 0,
    R: CFG.R, L: CFG.L, rewardTool: null,   // R = ふつうのハブと供給元の範囲 (道具では変わらない)。航続距離 L は道具で伸びる
    rangeStock: 0, toolHint: 0, toolNew: 0, // 手持ちの範囲拡大の道具 (上の帯からハブへ運んで使う)・使い方の誘導の残り秒数・受け取った直後に脈打つ残り秒数
    lastKind: null, deliverT: 0,            // 最後に届けた荷物の種類・届けた数の数字がその色でふくらむ残り秒数
    houseInt: CFG.houseInt0, nextHouse: CFG.houseInt0,
    over: false, overT: 0, reward: false, paused: false, speed: 1,
    info: false, started: false,        // 小窓 (プライバシーポリシーの入口) / 最初の入力があったか (ポータル SDK の gameplayStart 用)
    hbT: 0, nextId: 1, flash: 0,
    demand: 1,                          // 注文の速さの倍率。家を建てる場所が尽きると上がる (CFG.fullStep)
    newTown: null, unlockSnd: false,    // この局で開いた次の町 (終局画面で鍵が開く) / その音を鳴らしたか
    openedInGame: null, suspended: false, // 途中で一覧へ出たときに開いた町 / 途中で一覧へ出ていて続きから遊べる
    startBest: null,                    // 局を始めたときの最高記録 (終局で「今回が最高か」を見る)
  };
  { const b = loadBest(); S.startBest = b ? b.delivered : null; }
  for (const [ax, ay, bx, by, r] of TOWN.zones || [])   // 町の決まった空域 (最初からある)
    S.zones.push({ a: { x: ax, y: ay }, b: { x: bx, y: by }, x: (ax + bx) / 2, y: (ay + by) / 2, r, kind: 'airport', born: -10 });
  for (const def of srcDefs()) {
    const s = Object.assign({ kind: 'src', reach: false, born: 0, id: S.nextId++ }, def);

}
// 一覧の背景の飾り (2026-09-25): 下の空いた所に川と木立、上の角に木立。位置は決まっている (乱数なし)。町の絵・名前・記録の行にかけない
const MENU_RIVER = [[-2, 50.5], [22, 44], [40, 56], [62, 47.5], [80, 44], [102, 51]];
function drawMenuDecor() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const path = () => { ctx.beginPath(); ctx.moveTo(MENU_RIVER[0][0], MENU_RIVER[0][1]);
    for (let i = 1; i < MENU_RIVER.length; i++) { const [x0, y0] = MENU_RIVER[i - 1], [x1, y1] = MENU_RIVER[i]; ctx.bezierCurveTo((x0 + x1) / 2, y0, (x0 + x1) / 2, y1, x1, y1); } };
  path(); ctx.strokeStyle = C.water2; ctx.lineWidth = 3.7; ctx.stroke();
  ctx.strokeStyle = C.water; ctx.lineWidth = 3.2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.25; ctx.setLineDash([2.2, 3.4]); ctx.stroke(); ctx.setLineDash([]);
  for (let g = 0; g < 16; g++) {
    const top = g < 6, cx = top ? [4, 14, 24, 76, 88, 97][g] : 3 + hash3(7, g, 1) * 94, cy = top ? 4 + hash3(7, g, 2) * 7 : 43.5 + hash3(7, g, 2) * 11;
    if (top && cx > 26 && cx < 74) continue;
    for (let i = 0; i < 5; i++) {
      const a = hash3(7, g * 16 + i, 4) * Math.PI * 2, d = Math.sqrt(hash3(7, g * 16 + i, 5)) * 2.4;
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * 0.8, r = 0.7 + hash3(7, g * 16 + i, 6) * 0.4;
      if (!top && (y < 43 || Math.abs(y - (46 + 3 * Math.sin(x / 9))) < 0)) continue;
      if (MENU_CARDS.some(c => Math.abs(x - c.x) < c.w / 2 + 2 && y < c.y + c.h / 2 + 6.5)) { if (!top) continue; }
      if (menuRiverDist(x, y) < 3) continue;
      shadowOf(x, y, r * 0.95, r * 0.7);
      ctx.fillStyle = C.treeDark; circle(x, y + 0.12, r); ctx.fill();
      ctx.fillStyle = C.tree; circle(x - 0.08, y - 0.05, r * 0.86); ctx.fill();
      ctx.fillStyle = C.treeHi; circle(x - r * 0.3, y - r * 0.32, r * 0.36); ctx.fill();
    }
  }
}
function menuRiverDist(x, y) {         // 飾りの川までのおおよその距離 (縦方向)
  for (let i = 1; i < MENU_RIVER.length; i++) {
    const [x0, y0] = MENU_RIVER[i - 1], [x1, y1] = MENU_RIVER[i];
    if (x >= x0 && x <= x1) { const k = (x - x0) / (x1 - x0), e = k * k * (3 - 2 * k); return Math.abs(y - (y0 + (y1 - y0) * e)); }
  }
  return 99;
}
function drawMenu(now) {
  ctx.fillStyle = C.grass; ctx.fillRect(0, 0, W, H);
  drawMenuDecor();
  drawMenuDrones(now);
  drawMenuLogo(now);
  // 開く順の矢印 (町と町のあいだ)
  for (let i = 0; i + 1 < MENU_CARDS.length; i++) {
    const a = MENU_CARDS[i], b = MENU_CARDS[i + 1], x = (a.x + a.w / 2 + b.x - b.w / 2) / 2;
    ctx.strokeStyle = 'rgba(59,63,71,0.45)'; ctx.lineWidth = 0.45; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x - 0.5, a.y - 1.2); ctx.lineTo(x + 0.6, a.y); ctx.lineTo(x - 0.5, a.y + 1.2); ctx.stroke();
  }
  for (const c of MENU_CARDS) {
    const open = isOpen(c.id), b = bestOf(c.id), fresh = freshTowns.has(c.id);
    const lift = open && hover && inMenuCard(hover, c) ? 0.5 : 0, y = c.y - lift;
    ctx.fillStyle = 'rgba(40,50,40,0.16)'; rr(c.x - c.w / 2 - 0.3, c.y - c.h / 2 + 0.2, c.w + 1.6, c.h + 1.6, 1.4); ctx.fill();   // 影
    ctx.fillStyle = '#ffffff'; rr(c.x - c.w / 2 - 0.8, y - c.h / 2 - 0.8, c.w + 1.6, c.h + 1.6, 1.4); ctx.fill();                    // 白い額
    if (fresh) {                       // 開いたばかりの町: 縁が青く脈打つ
      ctx.strokeStyle = 'rgba(47,99,176,' + (0.55 + 0.4 * Math.sin(now * 5)) + ')'; ctx.lineWidth = 0.55; ctx.stroke();
    }
    drawTownThumb(c.id, c.x, y, c.w);
    if (open) {
      drawPlayMark(c.x + c.w / 2 - 3.3, y - c.h / 2 + 3.3, 0.95);   // 右上の角 (3 つの町とも飾りしかない所。供給元・網・空域を隠さない)
      if (S.suspended && c.id === TOWN_ID) {   // 途中で出た局: 絵の上の縁に、いま届けている数 (この町を選ぶと続きから)
        const tw = textW(String(S.delivered), 2.6, true), w = tw + 5.4, py = y - c.h / 2;
        ctx.fillStyle = C.hubLine; rr(c.x - w / 2, py - 1.7, w, 3.4, 1.7); ctx.fill();
        drawPackage(c.x - w / 2 + 2.1, py, 1.7, 'mail');
        text(String(S.delivered), c.x - w / 2 + 3.6, py + 0.1, 2.6, '#ffffff', 'left', true);
      }
    } else {                           // 暗い絵に鍵、その下に「ひとつ前の町の 1 局で届ける数」
      ctx.fillStyle = 'rgba(52,58,72,0.58)'; ctx.fillRect(c.x - c.w / 2, y - c.h / 2, c.w, c.h);
      const sh = MENU.shakeId === c.id && MENU.shake > 0 ? Math.sin(MENU.shake * 60) * 0.5 * (MENU.shake / 0.45) : 0;
      drawLock(c.x + sh, y - 2.4, 1.55, 0, '#ffffff');
      const need = ORDER.find(o => o.id === c.id).need;
      drawPackage(c.x - 3.1, y + 3.4, 2.2, 'mail');
      text(String(need), c.x - 1.4, y + 3.55, 3.4, '#ffffff', 'left', true);
    }
    if (open && b) {                   // 最高記録 (星と数字)
      ctx.fillStyle = '#f2c14e'; star(c.x - 2.2, c.y + c.h / 2 + 3.4, 1.25); ctx.fill();
      text(String(b.delivered), c.x - 0.4, c.y + c.h / 2 + 3.5, 3.2, C.ink, 'left', true);
    }
  }
  drawBtn('info');
}
function drawOver(now) {
  const a = Math.min(1, S.overT / 0.6), L = overLayout();
  ctx.fillStyle = 'rgba(40,48,62,' + (0.5 * a) + ')'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  { const top = L.num - 6.8, bot = L.btnY + 5.6, k = 0.94 + 0.06 * easeOut(S.overT / 0.35);   // 盤 (2026-09-25): 数字とボタンを 1 枚の板にまとめる
    ctx.save(); ctx.translate(50, (top + bot) / 2); ctx.scale(k, k); ctx.translate(-50, -(top + bot) / 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(33.4, top + 0.7, 34, bot - top, 2.2); ctx.fill();
    ctx.fillStyle = '#2b3950'; rr(33, top, 34, bot - top, 2.2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 0.25; ctx.stroke();
    ctx.restore(); }
  drawPackage(50 - 4.5, L.num, 4.2, 'mail');
  text(String(S.delivered), 50 - 1.2, L.num + 0.2, 8, '#ffffff', 'left', true);
  // 最高記録: 星と数字。今回が最高なら金色でふくらむ (数字は同じ値)。過去の記録が上なら白く小さく
  if (S.best != null) {
    const rec = S.record, k = rec ? 1 + 0.18 * Math.max(0, Math.sin(S.overT * 5)) : 1;
    ctx.fillStyle = rec ? '#f2c14e' : 'rgba(255,255,255,0.75)';
    star(50 - 2.6, L.best, 1.35 * k); ctx.fill();
    text(String(S.best), 50 - 0.6, L.best + 0.1, 3.6 * k, rec ? '#f2c14e' : 'rgba(255,255,255,0.75)', 'left', true);
  }
  // この局で次の町が開いた: 暗い町の絵が出て、鍵が開き、明るくなる。押すとその町で始まる
  if (S.newTown) {
    const c = L.card, grow = easeOut((S.overT - 0.3) / 0.5), open = easeOut((S.overT - UNLOCK_T + 0.25) / 0.35);
    const lit = clamp01((S.overT - UNLOCK_T) / 0.5), gone = clamp01((S.overT - UNLOCK_T - 0.35) / 0.4);
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(0.6 + 0.4 * grow, 0.6 + 0.4 * grow); ctx.translate(-c.x, -c.y);
    ctx.globalAlpha = a * grow;
    ctx.fillStyle = '#ffffff'; rr(c.x - c.w / 2 - 0.7, c.y - c.h / 2 - 0.7, c.w + 1.4, c.h + 1.4, 1.2); ctx.fill();
    if (lit > 0) { ctx.strokeStyle = 'rgba(242,193,78,' + (0.6 + 0.4 * Math.sin(now * 5)) * lit + ')'; ctx.lineWidth = 0.6; ctx.stroke(); }
    drawTownThumb(S.newTown, c.x, c.y, c.w);
    ctx.fillStyle = 'rgba(52,58,72,' + (0.58 * (1 - lit)) + ')'; ctx.fillRect(c.x - c.w / 2, c.y - c.h / 2, c.w, c.h);
    if (gone < 1) { ctx.globalAlpha = a * grow * (1 - gone); drawLock(c.x, c.y - 0.4, 1.4, open, '#ffffff'); }
    if (gone > 0) { ctx.globalAlpha = a * grow * gone; drawPlayMark(c.x + c.w / 2 - 2.6, c.y - c.h / 2 + 2.6, 0.75); }   // 一覧と同じ右上の角
    ctx.restore();
    ctx.globalAlpha = a;
  }
  // やり直し / 一覧へ (丸の中の印)
  for (const k of ['again', 'list']) {
    const b = overBtn(k);
    ctx.fillStyle = k === 'again' ? C.hubLine : 'rgba(255,255,255,0.14)'; circle(b.x, b.y, b.r); ctx.fill();   // やり直しを主に
    if (k === 'again') drawAgainIcon(b.x, b.y, 0.72, '#ffffff'); else drawListIcon(b.x, b.y, 0.95, '#ffffff');
  }
  ctx.globalAlpha = 1;
}
function draw(now) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = MENU ? '#a9c98f' : TOWN.letterbox; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (MENU) { drawMenu(now); if (S.info) drawInfo(now); ctx.restore(); return; }
  drawTerrain([...S.houses, ...S.hubs, ...S.sources.filter(s => s.on)]);
  drawZones();
  // サービス範囲 (供給元も受け持つ)。つながっているものは 1 枚の面、それ以外は 1 つずつ点線で
  drawCoverage([...S.sources.filter(s => s.on && s.reach), ...S.hubs.filter(h => h.reach)]);
  for (const s of S.sources) if (s.on && !s.reach) drawRange(s, 0.45);
  for (const h of S.hubs) if (!h.reach) drawRange(h, h.build > 0 ? 0.45 + 0.5 * (1 - h.build / CFG.buildT) : 0.45);
  drawFx();
  drawEdges();
  drawHints(now);
  computePreview();
  for (const h of S.houses) drawHouse(h, !!servingHub(h));
  for (const s of S.sources) if (s.on) drawSource(s);
  for (const h of S.hubs) drawHub(h, h.reach ? 1 : 0.4, false);
  const hf = holdFrac();               // 長押しの進み具合: 輪が満ちると持ち上がる
  if (hf > 0.15) {
    const h = ptr.hit;
    ctx.strokeStyle = 'rgba(47,99,176,0.9)'; ctx.lineWidth = 0.35;
    ctx.beginPath(); ctx.arc(h.x, h.y, CFG.hubR + 0.9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * hf); ctx.stroke();
  }
  drawDrones(now);
  drawToolDrag(now);
  drawHUD();
  if (S.reward) drawReward(now);
  if (S.info) drawInfo(now);
  if (S.over) drawOver(now);
  ctx.restore();
}

// ---- ポータル SDK の差し込み口 -------------------------------------------
// Poki (gameLoadingFinished / gameplayStart / gameplayStop) と CrazyGames (loadingStop / gameplayStart / gameplayStop) は
// 求める合図が同じ。どちらに出すか決まるまで中身は空。毎フレーム「遊んでいる状態か」を見て、変わったときだけ1回呼ぶ (二重発火なし)
const Portal = {
  playing: false,
  loadingFinished() {},               // 最初の描画が終わったとき (1回)
  gameplayStart() {}, gameplayStop() {},
  sync(active) { if (active === this.playing) return; this.playing = active; if (active) this.gameplayStart(); else this.gameplayStop(); },
};
const isPlaying = () => !MENU && S.started && !S.over && !S.reward && !S.paused && !S.info && !document.hidden;   // 一覧はメニュー = 止めている扱い

// ---- ループ ---------------------------------------------------------
newGame();
if (!URL_TOWN) openMenu();             // ?town= で開いたときだけ一覧を飛ばす (検査・ボット用)
let last = performance.now();
function frame(now) {
  if (cv.width !== Math.round(innerWidth * (window.devicePixelRatio || 1)) ||
      cv.height !== Math.round(innerHeight * (window.devicePixelRatio || 1))) resize();   // resize イベントを取りこぼしても追従
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (document.hidden) dt = 0;
  checkHold();
  update(dt * S.speed);
  draw(now / 1000);
  if (!frame.loaded) { frame.loaded = true; Portal.loadingFinished(); }
  Portal.sync(isPlaying());
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
